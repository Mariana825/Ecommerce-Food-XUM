<button type="button" class="boton-carrito" [class.boton-carrito-pequeno]="pequeno" aria-label="Ver carrito">
  <svg class="icono-carrito" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <path d="M4 4h2l1.2 12.2A2 2 0 0 0 9.2 18h8.1a2 2 0 0 0 2-1.7L20.5 8H6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="21" r="1.2"/>
    <circle cx="17" cy="21" r="1.2"/>
  </svg>
  <span class="contador-carrito" *ngIf="(cantidadTotal$ | async) as cantidad">{{ cantidad }}</span>
</button>
